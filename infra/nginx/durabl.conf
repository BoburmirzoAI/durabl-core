# =============================================================================
# Durabl — server bloki (reverse proxy)
#
# Joylashuvi (konteynerda): /etc/nginx/conf.d/durabl.conf
# TAYANADI: /etc/nginx/nginx.conf (limit zonalari, `map`, resolver shu yerda).
#
# Yo'nalishlar:
#   /api/      -> api:8000        (REST API)
#   /ws/       -> api:8000        (WebSocket, Upgrade header'lari bilan)
#   /health    -> api:8000        (tashqi monitoring uchun ochiq)
#   /metrics   -> api:8000        (FAQAT ichki tarmoq — Prometheus)
#   /docs      -> api:8000        (FAQAT ichki tarmoq)
#   /          -> frontend:3000   (Next.js dashboard)
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    #: Haqiqiy domeningizni yozing (masalan: durabl.dev www.durabl.dev).
    #  `_` — har qanday Host nomini qabul qiladi.
    server_name _;

    #: So'rov tanasi chegarasi — kod 256 KB, payload 1 MB (config.py bilan mos),
    #  shuning uchun 2 MB yetarli va ortiqcha emas.
    client_max_body_size 2m;

    # -------------------------------------------------------------------------
    # Backend manzillari o'zgaruvchida (nginx.conf'dagi resolver bilan ishlaydi)
    # -------------------------------------------------------------------------
    set $durabl_api      "http://api:8000";
    set $durabl_frontend "http://frontend:3000";

    # -------------------------------------------------------------------------
    # Xavfsizlik header'lari
    #
    # DIQQAT: `add_header` meros bo'lib o'tadi, lekin location ichida YANGI
    # `add_header` yozilsa — server darajasidagilar O'CHADI. Shu sababli
    # quyidagi location'larda qo'shimcha `add_header` ishlatilmaydi
    # (keshlash uchun `expires` direktivasi ishlatilgan).
    # -------------------------------------------------------------------------

    #: HSTS — brauzer faqat HTTPS orqali ulanadi.
    #  HTTPS yoqilmagan bo'lsa bu header ta'sir qilmaydi (zarari ham yo'q),
    #  `always` esa xato javoblarda ham yuborilishini ta'minlaydi.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #: Sahifani boshqa saytga iframe qilib qo'yishni taqiqlaydi (clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;
    #: MIME turini "taxmin qilish"ni o'chiradi
    add_header X-Content-Type-Options "nosniff" always;
    #: Boshqa saytga o'tganda to'liq URL yuborilmaydi
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #: Kamera/mikrofon/geolokatsiya kerak emas
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    #: CSP — Next.js uchun `unsafe-inline`/`unsafe-eval` kerak bo'ladi.
    #  `connect-src` ichida WebSocket sxemalari ham bor.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # -------------------------------------------------------------------------
    # Nginx o'zining sog'lik tekshiruvi (docker healthcheck shuni so'raydi) —
    # backend'ga tegmaydi, shuning uchun API qulasa ham 200 qaytaradi.
    # -------------------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nginx ishlayapti\n";
    }

    # -------------------------------------------------------------------------
    # ACME (Let's Encrypt) http-01 tekshiruvi — sertifikat olish/yangilash
    # -------------------------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Autentifikatsiya — brute force'ga qarshi eng qattiq cheklov.
    # (`/api/`dan oldin turishi kerak: nginx uzunroq prefiksni tanlaydi)
    # -------------------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=durabl_auth burst=5 nodelay;
        limit_conn durabl_conn 20;

        proxy_pass $durabl_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $durabl_request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # -------------------------------------------------------------------------
    # Job yuborish — SDK ko'p so'rov yuborishi mumkin, shuning uchun
    # alohida (yumshoqroq) zona ishlatiladi.
    # -------------------------------------------------------------------------
    location /api/v1/jobs {
        limit_req zone=durabl_submit burst=120 nodelay;
        limit_conn durabl_conn 50;

        proxy_pass $durabl_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $durabl_request_id;
        #: Idempotency-Key header'i avtomatik uzatiladi (o'zgartirilmaydi)
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        #: Javobni bufer qilmaslik — natijani darhol mijozga uzatish
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # Qolgan barcha API endpointlari
    # -------------------------------------------------------------------------
    location /api/ {
        limit_req zone=durabl_api burst=60 nodelay;
        limit_conn durabl_conn 50;

        proxy_pass $durabl_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $durabl_request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # -------------------------------------------------------------------------
    # WebSocket — real-time job holati (/ws/jobs?token=<jwt>)
    #
    # Upgrade header'lari majburiy, aks holda ulanish 400 bilan uziladi.
    # Timeout uzun: ulanish soatlab ochiq turishi normal holat.
    # -------------------------------------------------------------------------
    location /ws/ {
        limit_conn durabl_conn 50;

        proxy_pass $durabl_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $durabl_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $durabl_request_id;

        #: WebSocket uchun buferlash o'chiriladi (xabar darhol yetib borishi kerak)
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 5s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # -------------------------------------------------------------------------
    # Sog'lik tekshiruvi — tashqi monitoring uchun ochiq, logga yozilmaydi
    # -------------------------------------------------------------------------
    location = /health {
        access_log off;
        proxy_pass $durabl_api/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    location = /ready {
        access_log off;
        proxy_pass $durabl_api/ready;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # -------------------------------------------------------------------------
    # Prometheus metrikalari — FAQAT ichki tarmoqdan.
    # Metrikalar ichida ish hajmi haqida ma'lumot bor — tashqariga chiqmasin.
    # -------------------------------------------------------------------------
    location = /metrics {
        #: Docker ichki tarmoqlari va localhost
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        access_log off;

        proxy_pass $durabl_api/metrics;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    # -------------------------------------------------------------------------
    # OpenAPI hujjatlari — ichki tarmoqdan (production'da ENABLE_DOCS=false)
    # -------------------------------------------------------------------------
    location ~ ^/(docs|redoc|openapi\.json)$ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass $durabl_api$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # -------------------------------------------------------------------------
    # Next.js statik fayllari — uzoq muddat keshlanadi (nomida hash bor)
    # -------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass $durabl_frontend$request_uri;
        proxy_set_header Host $host;

        #: `expires` — `add_header` merosini buzmaydi (yuqoridagi izohga qarang)
        expires 1y;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Frontend (Next.js) — qolgan hamma narsa
    # -------------------------------------------------------------------------
    location / {
        limit_req zone=durabl_api burst=120 nodelay;

        proxy_pass $durabl_frontend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $durabl_request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # -------------------------------------------------------------------------
    # Xato javoblari — API shartnomasidagi shaklda: {"error":{"code","message"}}
    # (CONTRACTS.md 12-bo'lim). Mijoz SDK'si shu shaklni kutadi.
    # -------------------------------------------------------------------------
    error_page 429 = @xato_429;
    error_page 502 503 = @xato_502;
    error_page 504 = @xato_504;

    location @xato_429 {
        default_type application/json;
        return 429 "{\"error\":{\"code\":\"rate_limit_exceeded\",\"message\":\"So'rovlar soni chegaradan oshdi, keyinroq qayta urinib ko'ring\"}}";
    }

    location @xato_502 {
        default_type application/json;
        return 502 "{\"error\":{\"code\":\"service_unavailable\",\"message\":\"Servis vaqtincha ishlamayapti\"}}";
    }

    location @xato_504 {
        default_type application/json;
        return 504 "{\"error\":{\"code\":\"gateway_timeout\",\"message\":\"Servis javob berishga ulgurmadi\"}}";
    }
}

# =============================================================================
# HTTPS (TLS) — sertifikat olgandan keyin quyidagini oching
#
# 1-qadam: sertifikat olish (nginx ishlab turganda):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm \
#     -v durabl_nginx_certs:/etc/letsencrypt \
#     -v durabl_certbot_webroot:/var/www/certbot \
#     certbot/certbot certonly --webroot -w /var/www/certbot \
#     -d durabl.dev -d www.durabl.dev --email admin@durabl.dev --agree-tos -n
#
# 2-qadam: quyidagi blokni izohdan chiqarish, `server_name`ni o'zgartirish,
#          yuqoridagi `listen 80` serverini HTTPS'ga yo'naltirishga aylantirish:
#            location / { return 301 https://$host$request_uri; }
#          (ACME va /nginx-health location'lari 80-portda QOLISHI kerak)
#
# 3-qadam: nginx -t bilan tekshirish va `docker compose exec nginx nginx -s reload`
#
# DIQQAT: sertifikat fayllari bo'lmasa `nginx -t` XATO beradi — shuning uchun
# bu blok standart holatda izohda turadi.
# =============================================================================
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#
#     server_name durabl.dev www.durabl.dev;
#
#     # Sertifikatlar (nomlangan volume: durabl_nginx_certs -> /etc/nginx/certs)
#     ssl_certificate     /etc/nginx/certs/live/durabl.dev/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/live/durabl.dev/privkey.pem;
#     ssl_trusted_certificate /etc/nginx/certs/live/durabl.dev/chain.pem;
#
#     # Faqat zamonaviy protokollar (TLS 1.0/1.1 xavfsiz emas)
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
#
#     # Sessiya keshi — qayta ulanish tezroq bo'ladi
#     ssl_session_cache shared:DURABL_TLS:10m;
#     ssl_session_timeout 1d;
#     ssl_session_tickets off;
#
#     # OCSP stapling — brauzer sertifikat holatini tezroq tekshiradi
#     ssl_stapling on;
#     ssl_stapling_verify on;
#
#     # Yuqoridagi 80-portli serverdagi location'lar va header'lar
#     # BUTUNLAY TAKRORLANADI (nginx `include` bilan ajratish ham mumkin).
# }
