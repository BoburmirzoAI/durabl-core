# =============================================================================
# Durabl — CI (GitHub Actions)
#
# Ishlar ATAYLAB mustaqil job'larga bo'lingan, bitta uzun zanjirga emas:
# lint 40 soniyada yiqilsa, frontend build'ini 3 daqiqa kutish kerak emas.
# Har bir job o'z xulosasini alohida beradi, ya'ni PR'da "nima buzildi?"
# savoliga bir qarashda javob bo'ladi.
#
# Nega `make` chaqiriladi, buyruqlar takrorlanmaydi: lokalda va CI'da AYNI
# buyruq ishlashi kerak. Aks holda "lokalda o'tadi, CI'da yiqiladi" holati
# paydo bo'ladi va uni tuzatish uchun ikki joyni sinxron tutib turish kerak.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Qo'lda ishga tushirish — CI ni tekshirish uchun kod o'zgartirish shart emas.
  workflow_dispatch:

# Ayni branch uchun yangi push kelsa, eski ishni to'xtatadi: navbat
# tozalanadi va natija tezroq keladi. `main` esa BEKOR QILINMAYDI —
# u reliz tarixi, har bir commit o'z natijasiga ega bo'lishi kerak.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Standart ruxsat — faqat o'qish. Hech bir job yozmaydi.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend lint — eng tez darvoza, birinchi yiqiladi
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend — lint va tiplar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Bog'liqliklarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # `make lint` ni takrorlamaymiz, lekin `$(BIN)` yo'li CI'da boshqa
      # (venv yo'q, paketlar global) — shuning uchun buyruqlar ochiq.
      - name: ruff check
        run: ruff check app tests scripts alembic
        working-directory: backend

      - name: ruff format --check
        run: ruff format --check app tests scripts alembic
        working-directory: backend

      - name: mypy
        run: mypy app
        working-directory: backend

  # ---------------------------------------------------------------------------
  # 2. Backend testlar — 1083 test, Docker TALAB QILMAYDI
  #    (SQLite xotirada + fakeredis, `pyproject.toml` da `-m "not docker"`)
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend — testlar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Bog'liqliklarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # `tests/conftest.py` kerakli muhitni O'ZI qo'yadi (ENV=test,
      # SQLite xotira, REDIS_FAKE, BCRYPT_ROUNDS=4) — shuning uchun bu
      # yerda hech qanday env bermaymiz. Bitta manba qoidasi.
      # Chiqish faylga yoziladi va yiqilganda yiqilgan test nomlari
      # `::error::` annotatsiyasi sifatida chiqariladi.
      #
      # Nega shunday: job LOGINI o'qish uchun repozitoriyga admin huquqi
      # kerak, annotatsiyalar esa ochiq repo'da API orqali o'qiladi
      # (`/check-runs/{id}/annotations`). Ya'ni "CI yiqildi, lekin nega
      # ekani ko'rinmaydi" holati bo'lmaydi — nom darhol ko'rinadi.
      - name: pytest (qoplama bilan)
        working-directory: backend
        run: |
          set +e
          pytest --cov=app --cov-report=term-missing --cov-report=xml -q > pytest-output.txt 2>&1
          code=$?
          set -e
          tail -40 pytest-output.txt
          if [ "$code" -ne 0 ]; then
            # `-q` rejimida chiqish TTY bo'lmaganda yakuniy qator
            # chiqmaydi, lekin `FAILED`/`ERROR` qatorlari chiqadi.
            grep -E '^(FAILED|ERROR)' pytest-output.txt | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            {
              printf '## Yiqilgan testlar\n\n```\n'
              grep -E '^(FAILED|ERROR)' pytest-output.txt || printf '(nom aniqlanmadi)\n'
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Qoplamani xulosaga yozish
        if: always()
        run: |
          printf '## Qoplama\n\n```\n' >> "$GITHUB_STEP_SUMMARY"
          coverage report --skip-covered --sort=cover | tail -25 >> "$GITHUB_STEP_SUMMARY" || true
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
        working-directory: backend

      # Yiqilganda ham saqlanadi — to'liq chiqish artifact'dan olinadi.
      - name: Hisobotlarni saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/coverage.xml
            backend/pytest-output.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Migratsiyalar — ikki yo'nalishda va drift tekshiruvi
  #
  # Nega alohida job: migratsiya buzilishi testlardan O'TIB KETADI.
  # Testlar `create_all=True` bilan sxemani MODELLARDAN yasaydi, ya'ni
  # migratsiya fayllariga umuman tegmaydi. Shu sababli "testlar yashil,
  # lekin `alembic upgrade` yiqiladi" holati butunlay mumkin.
  # ---------------------------------------------------------------------------
  migrations:
    name: Migratsiyalar — oldinga, orqaga, drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # PostgreSQL ham tekshiriladi: SQLite ba'zi DDL xatolarini yutib
    # yuboradi (masalan `ALTER TABLE` cheklovlari), production esa
    # PostgreSQL'da ishlaydi.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: durabl_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Bog'liqliklarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: SQLite — upgrade / downgrade / upgrade
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migrate.db
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: PostgreSQL — upgrade / downgrade / upgrade
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/durabl_ci
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      # Migratsiyadan hosil bo'lgan sxema modellarga mos kelishini
      # tekshiradi. Mos kelmasa — kimdir modelni o'zgartirib migratsiya
      # yozmagan, va bu production'da `ProgrammingError` bo'lib chiqadi.
      - name: Drift tekshiruvi (modellar vs migratsiya)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/durabl_ci
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
        run: python scripts/check_migration_drift.py

  # ---------------------------------------------------------------------------
  # 4. Frontend — lint, tiplar, build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend — lint, tiplar, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` — `npm install` EMAS: lockfile'ga aynan rioya qiladi va
      # uni o'zgartirmaydi. CI'da takrorlanadigan natija shundan keladi.
      - name: npm ci
        run: npm ci
        working-directory: frontend

      - name: eslint
        run: npm run lint
        working-directory: frontend

      - name: tsc --noEmit
        run: npm run typecheck
        working-directory: frontend

      # Chiqish faylga yoziladi va yiqilganda oxirgi qatorlar `::error::`
      # annotatsiyasi qilib chiqariladi — `backend-test` dagi bilan ayni
      # yondashuv. Sababi ham ayni: job LOGINI o'qish uchun admin huquqi
      # kerak, annotatsiya esa ochiq API orqali o'qiladi.
      #
      # Bu qadam haqiqatan yiqilgan va annotatsiyada faqat "exit code 1"
      # turgan edi — ya'ni tashxis uchun ma'lumot YO'Q edi.
      - name: next build
        working-directory: frontend
        run: |
          set +e
          npm run build > build-output.txt 2>&1
          code=$?
          set -e
          tail -60 build-output.txt
          if [ "$code" -ne 0 ]; then
            # Next.js xatoni ko'p qatorda yozadi; annotatsiyaga eng
            # ma'noli qatorlar chiqariladi.
            grep -iE 'error|failed|cannot|out of memory|heap' build-output.txt \
              | head -12 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            {
              printf '## Frontend build xatosi\n\n```\n'
              tail -60 build-output.txt
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Build chiqishini saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-output
          path: frontend/build-output.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 5. Sandbox testlari — HAQIQIY Docker konteyner
  #
  # `SANDBOX_RUNTIME=runc`: GitHub runner'da gVisor (`runsc`) yo'q.
  # Izolyatsiya kuchsizroq bo'ladi, lekin sinalayotgan narsa boshqa —
  # konteyner hayot sikli, log yig'ish, natija shartnomasi va egasiz
  # konteynerni tozalash. Bular runtime'ga bog'liq emas.
  # ---------------------------------------------------------------------------
  sandbox:
    name: Sandbox — Docker testlari
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Bog'liqliklarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # Smoke test build.sh ichida bajariladi, ya'ni image yaroqsiz
      # bo'lsa testlarga yetib bormasdan shu yerda yiqiladi.
      - name: Runner image'larini yig'ish
        run: ./build.sh --runtime=runc
        working-directory: sandbox

      - name: pytest -m docker
        working-directory: backend
        env:
          SANDBOX_RUNTIME: runc
        run: pytest -m docker

      # Testlardan keyin konteyner qolmasligi — bu LOYIHANING O'Z
      # kafolati (`cleanup_orphans`). Agar qolsa, demak tozalash
      # buzilgan va buni CI aytishi kerak, server to'lgandan keyin emas.
      - name: Qoldiq konteyner qolmaganini tekshirish
        run: |
          left=$(docker ps -aq --filter "label=durabl.managed=true" | wc -l | tr -d ' ')
          echo "durabl.managed yorlig'li konteynerlar: $left"
          if [ "$left" != "0" ]; then
            echo "::error::Testlardan keyin $left ta sandbox konteyneri qoldi"
            docker ps -a --filter "label=durabl.managed=true"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 6. Yagona darvoza — branch protection shu job'ga bog'lanadi
  #
  # Nega kerak: branch protection'da 5 ta job nomini qo'lda sanash
  # kerak bo'lardi va yangi job qo'shilganda uni yana qo'lda qo'shish
  # esdan chiqadi. Bu job esa hammasini kutadi, ya'ni ro'yxat bitta
  # joyda — shu faylda.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, migrations, frontend, sandbox]
    if: always()
    steps:
      - name: Natijalarni yig'ish
        run: |
          echo "backend-lint:  ${{ needs.backend-lint.result }}"
          echo "backend-test:  ${{ needs.backend-test.result }}"
          echo "migrations:    ${{ needs.migrations.result }}"
          echo "frontend:      ${{ needs.frontend.result }}"
          echo "sandbox:       ${{ needs.sandbox.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Kamida bitta job yiqildi"
            exit 1
          fi
