[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "durabl"
dynamic = ["version"]
description = "Durabl uchun Python SDK — ishonchli background job va xavfsiz kod bajarish platformasi"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Durabl", email = "sdk@durabl.dev" }]
maintainers = [{ name = "Durabl", email = "sdk@durabl.dev" }]
keywords = [
    "durabl",
    "background-jobs",
    "job-queue",
    "task-queue",
    "sandbox",
    "gvisor",
    "code-execution",
    "idempotency",
    "dlq",
    "webhooks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://durabl.dev"
Documentation = "https://durabl.dev/docs/sdk/python"
Repository = "https://github.com/durabl/durabl"
Issues = "https://github.com/durabl/durabl/issues"
Changelog = "https://github.com/durabl/durabl/blob/main/sdk/python/CHANGELOG.md"

[tool.hatch.version]
path = "durabl/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["durabl"]

[tool.hatch.build.targets.sdist]
include = ["durabl", "tests", "README.md", "pyproject.toml"]

# ---------------------------------------------------------------------------
# Testlar
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

# ---------------------------------------------------------------------------
# Linter (ruff)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    # `datetime.timezone.utc` 3.9 uchun zarur (`datetime.UTC` faqat 3.11+)
    "UP017",
]

[tool.ruff.lint.per-file-ignores]
# Testlarda uzun mock javoblar va `assert` ko'p — bu normal.
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["durabl"]
