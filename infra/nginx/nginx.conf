# =============================================================================
# Durabl — nginx asosiy konfiguratsiyasi
#
# Joylashuvi (konteynerda): /etc/nginx/nginx.conf
# Server bloki alohida faylda: /etc/nginx/conf.d/durabl.conf
#
# Bu faylda `http` darajasidagi narsalar turadi: loglar, gzip, limit zonalari,
# DNS resolver va WebSocket uchun `map`. Server bloki shularga tayanadi.
# =============================================================================

#: Rasmiy nginx image'idagi foydalanuvchi (master root, ishchilar nginx nomidan)
user nginx;

#: Yadro soniga qarab avtomatik (konteyner CPU limitiga mos keladi)
worker_processes auto;

#: Har bir ishchi protsess ocha oladigan fayl (socket) soni
worker_rlimit_nofile 32768;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    #: Bitta ishchi uchun maksimal ulanish (jami = worker_processes * shu son)
    worker_connections 4096;
    #: Yangi ulanishlarni to'p-to'p qabul qilish (yuqori yuklamada tezroq)
    multi_accept on;
}

http {
    # -------------------------------------------------------------------------
    # Asoslar
    # -------------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    #: Nginx versiyasini yashiramiz (hujumchiga ma'lumot bermaslik)
    server_tokens off;

    charset utf-8;

    # -------------------------------------------------------------------------
    # Loglar — JSON formatda (structlog bilan bir xil o'qiladi)
    # -------------------------------------------------------------------------

    #: Mijoz `X-Request-ID` yubormagan bo'lsa, nginx o'zi yasaydi.
    #  Shu qiymat backend'ga uzatiladi va loglar bir-biriga bog'lanadi.
    map $http_x_request_id $durabl_request_id {
        default   $request_id;
        "~^.+$"   $http_x_request_id;
    }

    #: WebSocket uchun `Connection` header'i: upgrade bo'lsa — "upgrade",
    #  aks holda — "close" (keepalive'ni buzmaslik uchun)
    map $http_upgrade $durabl_connection_upgrade {
        default upgrade;
        ""      close;
    }

    log_format durabl_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$durabl_request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /var/log/nginx/access.log durabl_json;

    # -------------------------------------------------------------------------
    # Ulanish va uzatish sozlamalari
    # -------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65s;
    keepalive_requests 1000;

    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;

    #: So'rov tanasi va vaqt chegaralari (sekin hujumlarga — Slowloris — qarshi)
    client_max_body_size 2m;
    client_body_buffer_size 128k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    reset_timedout_connection on;

    #: Katta javob header'lari (JWT va boshqa uzun header'lar uchun)
    proxy_buffer_size 8k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # -------------------------------------------------------------------------
    # Gzip — JSON javoblar va statik fayllarni siqish
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    #: Proxy orqali kelgan javoblarni ham siqamiz
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_disable "msie6";
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        application/atom+xml
        application/manifest+json
        application/vnd.api+json
        font/ttf
        font/otf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # -------------------------------------------------------------------------
    # Rate limit zonalari (ishlatilishi — durabl.conf ichida)
    #
    # `$binary_remote_addr` — IP (xotirada ixcham). Nginx proxy ortida bo'lsa
    # `real_ip` moduli bilan haqiqiy IP aniqlanadi (pastda).
    # -------------------------------------------------------------------------

    #: Umumiy API chastotasi: sekundda 30 so'rov (burst durabl.conf'da)
    limit_req_zone $binary_remote_addr zone=durabl_api:10m rate=30r/s;

    #: Autentifikatsiya — brute force'ga qarshi juda qattiq: daqiqada 10
    limit_req_zone $binary_remote_addr zone=durabl_auth:10m rate=10r/m;

    #: Job yuborish — daqiqada 600 (sekundda ~10), SDK ko'p yuborishi mumkin
    limit_req_zone $binary_remote_addr zone=durabl_submit:10m rate=600r/m;

    #: Bir IP dan bir vaqtda ochilgan ulanishlar soni (WebSocket uchun ham)
    limit_conn_zone $binary_remote_addr zone=durabl_conn:10m;

    #: Chegaradan oshganda 429 qaytaramiz (standart 503 emas) —
    #  mijoz SDK'si 429'ni "keyinroq qayta urin" deb tushunadi
    limit_req_status 429;
    limit_conn_status 429;
    #: Faqat haqiqiy cheklanishlarni logga yozamiz
    limit_req_log_level warn;

    # -------------------------------------------------------------------------
    # Haqiqiy mijoz IP'si (agar nginx oldida CDN/balanser bo'lsa).
    # Ishonchli manbalar ro'yxatini o'zingizning tarmog'ingizga moslang.
    # -------------------------------------------------------------------------
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # -------------------------------------------------------------------------
    # DNS resolver — Docker ichki DNS (127.0.0.11).
    #
    # NIMA UCHUN KERAK: servis nomlari (`api`, `frontend`) `proxy_pass`da
    # o'zgaruvchi orqali ishlatiladi. Shunda konteyner qayta ishga tushib IP
    # o'zgarsa ham nginx nomni qaytadan aniqlaydi (upstream bloki esa IP'ni
    # bir marta, start paytida eslab qoladi va keyin xato beradi).
    # Docker'dan tashqarida ishlatsangiz — bu manzilni o'zgartiring.
    # -------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # Server bloklari
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/durabl.conf;
}
