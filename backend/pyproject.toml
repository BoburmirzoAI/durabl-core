[project]
name = "durabl-backend"
version = "1.0.0"
description = "Durabl — ishonchli background job va kod bajarish platformasi (backend)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B",                 # flake8-bugbear
    "C4",                # comprehensions
    "ASYNC",             # async xatolari
    "RUF",               # ruff'ning o'z qoidalari
    "DTZ",               # vaqt zonasiz datetime — pastdagi izohga qarang
    # flake8-bandit (xavfsizlik) — TO'LIQ `S` ataylab yoqilmagan, faqat
    # quyidagi qoidalar. Sababi: `S` ning katta qismi O'ZGARUVCHI NOMIGA
    # qarab ishlaydi (`S105` "password" so'zini ko'rsa ogohlantiradi), ya'ni
    # bizda 25 ta yolg'on signal berardi (`token_type`, `FAILED_PASSWORD`
    # enum nomi va h.k.). Ularni `noqa` bilan bo'g'ish kodni yomonlashtiradi
    # va haqiqiy signalni suyultiradi. Qotirilgan maxfiy kalitlardan himoya
    # nom bo'yicha linter EMAS, GitHub'ning secret scanning'i orqali keladi.
    #
    # Quyidagilar esa HARAKATGA qarab ishlaydi, ya'ni yolg'on signal bermaydi
    # va hozir hammasi toza (0 buzilish) — demak bu darvoza faqat KELGUSIDA
    # yozilgan xavfli kodni ushlaydi:
    "S301",              # pickle — ishonchsiz ma'lumotdan kod bajarilishi
    "S302", "S306", "S307",  # marshal, mktemp, eval
    "S308",              # mark_safe — XSS
    "S324",              # zaif hash (md5/sha1) xavfsizlik uchun
    "S501", "S502", "S503", "S506",  # SSL tekshiruvi o'chirilgan, xavfli yuklash
    "S602", "S603", "S604", "S605", "S606", "S607", "S609",  # subprocess/shell
    "S608",              # SQL in'ektsiyasi (matn ulash bilan so'rov yasash)
    "S612", "S701", "S702",  # logging config, jinja autoescape, mako
]
ignore = [
    "E501",   # qator uzunligi — formatter hal qiladi
    "B008",   # FastAPI'da `Depends()` standart qiymat sifatida normal
    "N818",   # xato klassi nomi `Error` bilan tugamasligi mumkin
    "RUF001", # kirillcha/lotincha o'xshash belgilar (o'zbekcha izohlar uchun)
    "RUF002",
    "RUF003",
    # PEP 695 generiklari (`class X[T]`) ataylab ishlatilmaydi: Pydantic v2 va
    # SQLAlchemy 2.x `Generic[T]` + `TypeVar` uslubi bilan ishonchli ishlaydi,
    # yangi sintaksis ba'zi joylarda tur xulosasini buzadi.
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008", "N802", "N803"]
"alembic/versions/*" = ["E402", "F401", "I001"]
# Bu faylning BUTUN maqsadi — naive va aware datetime o'tishini tekshirish,
# ya'ni zonasiz `datetime(...)` yasash uning sinov ma'lumoti. `DTZ001` shu
# yerda qoidabuzarlik emas, test kirishi.
"tests/unit/test_time_utils.py" = ["DTZ001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# `-m "not docker"` — haqiqiy Docker talab qiladigan testlar STANDART
# ishga tushirishda O'TKAZIB YUBORILADI. Ikki sabab:
#   1. Docker yo'q muhitda (CI) ular yiqilardi, holbuki kodda xato yo'q;
#   2. Ular o'nlab konteyner ko'taradi va mashinani yuklab, vaqtga sezgir
#      testlarni (`test_worker_pool`) tasodifan yiqitadi.
# Ularni ishga tushirish: `make test-sandbox` (u `-m docker` bilan bekor qiladi).
addopts = "-q --strict-markers --tb=short -m 'not docker'"
markers = [
    "unit: tez, izolyatsiyalangan testlar",
    "integration: DB/Redis bilan ishlaydigan testlar",
    "e2e: to'liq zanjir testlari",
    "slow: sekin testlar",
    "docker: haqiqiy Docker talab qiladi",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/alembic/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
