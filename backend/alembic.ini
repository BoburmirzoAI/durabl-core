# Durabl — Alembic konfiguratsiyasi.
#
# Ishlatish:
#   cd backend
#   alembic revision --autogenerate -m "izoh"   # yangi migratsiya
#   alembic upgrade head                        # qo'llash
#   alembic downgrade -1                        # bir qadam orqaga
#
# DIQQAT: DB manzili shu fayldan OLINMAYDI — `alembic/env.py` uni
# `app.config.settings.DATABASE_URL` dan oladi (yagona manba .env fayli).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Migratsiya fayl nomi: 2026_10_04_1530-abc123_izoh.py (vaqt bo'yicha tartiblanadi)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

# `env.py` sozlamadan oladi — bu yerda bo'sh qoldirilgan
sqlalchemy.url =

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
